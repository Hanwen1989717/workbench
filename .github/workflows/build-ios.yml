name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Setup build tools
        run: |
          brew install xcodegen

      - name: Build project
        run: |
          cd ios
          xcodegen generate
          xcodebuild -scheme WorkbenchApp -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Package IPA
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          mkdir Payload
          cp -r WorkbenchApp.app Payload/
          zip -r ../../../workbench.ipa Payload
          cd ../../..

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: workbench-ios
          path: ios/workbench.ipa
