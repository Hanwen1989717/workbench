name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Build
        run: cd ios && xcodebuild -project WorkbenchApp.xcodeproj -scheme WorkbenchApp -configuration Release -sdk iphoneos -archivePath build/WorkbenchApp.xcarchive archive CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd ios/build
          mkdir Payload
          cp -r WorkbenchApp.xcarchive/Products/Applications/WorkbenchApp.app Payload/
          zip -r 财务工作台.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 财务工作台-iOS
          path: ios/build/财务工作台.ipa
