name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate and build
        run: |
          cd ios
          xcodegen generate
          xcodebuild -project WorkbenchApp.xcodeproj -scheme WorkbenchApp -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          mkdir Payload
          cp -r WorkbenchApp.app Payload/
          zip -r ../../../workbench.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: workbench-ios
          path: ios/workbench.ipa
