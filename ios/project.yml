name: iOS Workbench

options:
  bundleIdPrefix: com.workbench
  deploymentTarget:
    iOS: "14.0"

targets:
  WorkbenchApp:
    type: application
    platform: iOS
    sources:
      - path: WorkbenchApp
    info:
      path: WorkbenchApp/Info.plist
      properties:
        CFBundleDisplayName: 财务工作台
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
